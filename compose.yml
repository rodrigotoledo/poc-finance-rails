networks:
  backend:

x-app: &app_defaults
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Defina em .env (veja .env.example) para coincidir com `id -u` / `id -g` no host — evita arquivos criados pelo container com outro dono.
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  tty: true
  stdin_open: true
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
  working_dir: /app
  env_file: .env
  networks:
    - backend

services:
  app:
    <<: *app_defaults
    environment:
      BUNDLE_GEMFILE: /app/Gemfile
    command: bin/docker-dev-start-web.sh
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Minitest + Guard: watch files and re-run tests (polling for macOS Docker volumes).
  # Usage: docker compose up guard   then in another terminal: docker compose exec guard bash
  # Or attach: docker compose attach guard
  guard:
    <<: *app_defaults
    environment:
      BUNDLE_GEMFILE: /app/Gemfile
      RAILS_ENV: test
      GUARD: "1"
      LISTEN_GEM_POLLING: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/credito_poc_test
    command: sh -c "bundle exec rails db:test:prepare && bundle exec guard -i"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: credito_poc_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - backend
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  bundle:
  postgres_data:
  redis_data:
