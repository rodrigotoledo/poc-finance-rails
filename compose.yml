# Serviços Rails (app + guard). Postgres e Redis estão em ../compose.infra.yml na raiz do monorepo.
# Arranque típico (a partir da raiz poc-financer; Rails primeiro para .env):
#   docker compose -f poc-finance/compose.yml -f compose.infra.yml up --build
#
networks:
  backend:

x-app: &app_defaults
  build:
    context: .
    dockerfile: Dockerfile
    args:
      # Defina em .env (veja .env.example) para coincidir com `id -u` / `id -g` no host — evita arquivos criados pelo container com outro dono.
      USER_ID: ${USER_ID:-1000}
      GROUP_ID: ${GROUP_ID:-1000}
  tty: true
  stdin_open: true
  volumes:
    - .:/app
    - bundle:/usr/local/bundle
  working_dir: /app
  env_file:
    - path: .env
      required: false
  networks:
    - backend

services:
  app:
    <<: *app_defaults
    environment:
      BUNDLE_GEMFILE: /app/Gemfile
    command: bin/docker-dev-start-web.sh
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  sidekiq:
    <<: *app_defaults
    environment:
      BUNDLE_GEMFILE: /app/Gemfile
      # Enable/disable the 5s scheduler tick (POC)
      DASHBOARD_TICK_ENABLED: ${DASHBOARD_TICK_ENABLED:-1}
      SIDEKIQ_CONCURRENCY: ${SIDEKIQ_CONCURRENCY:-5}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-50000}
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Minitest + Guard: watch files and re-run tests (polling for macOS Docker volumes).
  # Usage: docker compose up guard   then in another terminal: docker compose exec guard bash
  # Or attach: docker compose attach guard
  guard:
    <<: *app_defaults
    environment:
      BUNDLE_GEMFILE: /app/Gemfile
      RAILS_ENV: test
      GUARD: "1"
      LISTEN_GEM_POLLING: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/credito_poc_test
    command: sh -c "bundle exec rails db:test:prepare && bundle exec guard -i"
    depends_on:
      db:
        condition: service_healthy

volumes:
  bundle:
